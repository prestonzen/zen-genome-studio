name: Bug report
description: Report a reproducible problem without sharing genomic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use fictional examples only. Never upload a VCF, FASTQ, BAM, CRAM, analysis database, personal result, sample identifier, screenshot containing findings, or private file path.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all genomic data, personal findings, sample identifiers, and private paths from this report.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem using anonymous or fictional data.
      placeholder: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 143 on Windows 11
    validations:
      required: true
